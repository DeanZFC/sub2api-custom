<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>鹈鹕的海岸漫游 · The Pelican Post</title>
  <style>
    :root { --paper: #f5f1e7; --ink: #244c4a; --muted: #7b887c; --coral: #e77952; --line: #d7d9ca; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 5px; }
    .page { width: min(1520px, 100%); padding: 27px 52px 22px; margin: auto; }
    .masthead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 23px; border-bottom: 1px solid var(--line); gap: 20px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-icon { width: 43px; height: 43px; }
    .brand-name { font: 700 15px Georgia, serif; letter-spacing: 1.7px; }
    .brand small { display: block; margin-top: 5px; font-size: 9px; letter-spacing: 3px; color: var(--muted); }
    .masthead-note { display: flex; gap: 25px; align-items: center; font-size: 10px; letter-spacing: 1.6px; }
    .edition { border: 1px solid #b9c3b3; padding: 7px 10px; border-radius: 3px; font-size: 9px; }
    main { margin-top: 25px; }
    .postcard { position: relative; overflow: hidden; border: 1px solid #d5dbc9; border-radius: 6px; background: #e9eedd; isolation: isolate; }
    #coast { display: block; width: 100%; height: auto; }
    .headline { position: absolute; z-index: 2; left: 5%; top: 7.8%; pointer-events: none; }
    .eyebrow { margin: 0 0 20px; font-size: clamp(8px, .78vw, 11px); letter-spacing: 3px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(44px, 6.3vw, 91px); line-height: .98; font-weight: 400; margin: 0; letter-spacing: -4.5px; }
    h1 em { font-weight: 400; color: var(--coral); }
    .headline .description { font-size: clamp(10px, .95vw, 13px); margin-top: 23px; letter-spacing: 2px; line-height: 1.9; }
    .stamp { position: absolute; right: 3.3%; top: 5%; width: 83px; color: #728975; opacity: .72; transform: rotate(11deg); }
    .scene-bottom { position: absolute; bottom: 24px; left: 30px; right: 30px; display: flex; justify-content: space-between; color: #627c69; font-size: 9px; letter-spacing: 2px; pointer-events: none; }
    .scene-bottom b { font-weight: 500; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--line); }
    .caption { display: flex; align-items: center; gap: 15px; }
    .caption-icon { width: 38px; height: 38px; flex-shrink: 0; }
    .caption strong { display: block; font-size: 13px; letter-spacing: 1.7px; font-weight: 500; }
    .caption small { display: block; margin-top: 6px; font-size: 10px; letter-spacing: .8px; color: var(--muted); }
    .controls { display: flex; gap: 9px; align-items: center; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 11px 17px; min-height: 42px; border: 1px solid #cad1c1; border-radius: 24px; color: var(--ink); background: transparent; cursor: pointer; font-size: 11px; transition: background .18s, transform .18s; }
    .button:hover { background: #e5e9db; transform: translateY(-2px); }
    .button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 114px; }
    .button.primary:hover { background: #3a6661; }
    .button svg { width: 14px; height: 14px; }
    #speed-label { font-weight: 650; font-variant-numeric: tabular-nums; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-top: 19px; font-size: 9px; letter-spacing: 1.5px; color: #889084; }
    footer em { font: italic 13px Georgia, serif; letter-spacing: .2px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (min-width: 1600px) { .page { padding-top: 38px; } }
    @media (max-width: 800px) {
      .page { padding: 20px 20px 18px; }
      .masthead { padding-bottom: 18px; }
      .brand-name { font-size: 12px; } .brand small { font-size: 8px; letter-spacing: 2px; }
      .masthead-note .date { display: none; }
      main { margin-top: 18px; }
      .headline { top: 35px; left: 28px; }
      h1 { font-size: 60px; letter-spacing: -3px; }
      .eyebrow { font-size: 9px; margin-bottom: 17px; }
      .headline .description { margin-top: 17px; font-size: 11px; }
      #coast { width: 150%; max-width: none; margin-left: -25%; padding-top: 170px; }
      .stamp { width: 65px; top: 30px; right: 23px; }
      .scene-bottom { bottom: 17px; left: 20px; right: 20px; font-size: 8px; letter-spacing: 1px; }
      .toolbar { flex-wrap: wrap; padding: 21px 0; gap: 20px; }
      .controls { width: 100%; } .button { flex: 1; }
      .caption strong { font-size: 12px; } .caption small { font-size: 9px; }
      footer { font-size: 8px; letter-spacing: .7px; } footer em { font-size: 11px; }
    }
    @media (max-width: 430px) {
      .page { padding-inline: 14px; }
      h1 { font-size: 52px; } .headline { left: 23px; }
      .stamp { width: 53px; right: 15px; }
      .edition { font-size: 8px; } .button { padding-inline: 10px; }
      .scene-bottom span:last-child { display: none; }
    }
  </style>
</head>

      <div class="toolbar">
        <div class="caption">
          <svg class="caption-icon" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#b8c5b0"/><path d="M10 23q5-6 10 0t10 0M10 28q5-6 10 0t10 0" fill="none" stroke="#658771" stroke-width="1.5" stroke-linecap="round"/><circle cx="20" cy="14" r="4" fill="#e8bb6e"/></svg>
          <div><strong id="ride-status">正在享受，无所事事的快乐。</strong><small>海风刚好，下一站随心。</small></div>
        </div>
        <div class="controls" aria-label="动画控制">
          <button id="play" class="button primary" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><span id="play-label">歇一会儿</span></button>
          <button id="speed" class="button" type="button" aria-label="切换骑行速度，当前 1 倍"><span id="speed-label">1×</span><span>骑行速度</span></button>
          <button id="ring" class="button" type="button" aria-label="响一下车铃"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 13h12l-2-3V7a4 4 0 0 0-8 0v3Zm4 3q2 2 4 0M10 1v2"/></svg><span>叮铃一下</span></button>

    <footer><span>去哪里不重要，出发就很好。</span><em>Made for the joy of going nowhere.</em></footer>
    <p class="visually-hidden" id="announcement" role="status" aria-live="polite"></p>
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const parts = Object.fromEntries(['rear-wheel', 'front-wheel', 'crank', 'near-leg', 'near-leg-light', 'far-leg', 'near-foot', 'far-foot', 'rider', 'rider-shadow', 'scarf-tail', 'eye', 'clouds', 'sea-waves', 'sailboat', 'distant-birds', 'sand', 'road', 'far-plants', 'foreground', 'wind-lines', 'bell-rings'].map(id => [id, $(id)]));
      const TAU = Math.PI * 2;
      let time = 0, lastTime = null, paused = false, speed = 1, speedIndex = 1;
      let bellUntil = 0, audioContext;
      const speeds = [0.6, 1, 1.6, 2.2];
      const transform = (id, value) => parts[id].setAttribute('transform', value);
      const scroll = (id, distance) => transform(id, `translate(${-distance % 1400} 0)`);

      // Solve the knee from two fixed-length leg segments, keeping the webbed foot on the pedal.
      function leg(phase, far) {
        const hip = { x: far ? 726 : 735, y: far ? 450 : 454 };
        const foot = { x: 778 + Math.cos(phase) * 44, y: 601 + Math.sin(phase) * 44 - 11 };
        const upper = 103, lower = 111;
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * bend / distance, y: hip.y + dy * along / distance - dx * bend / distance };
        const d = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`;
        parts[far ? 'far-leg' : 'near-leg'].setAttribute('d', d);
        if (!far) parts['near-leg-light'].setAttribute('d', d);
        transform(far ? 'far-foot' : 'near-foot', `translate(${foot.x} ${foot.y})`);
      }

      function draw(now) {
        const phase = time * TAU / 1.65;
        const bob = Math.sin(phase * 2) * 1.3;
        const wheelAngle = time * 170;
        transform('rear-wheel', `rotate(${wheelAngle % 360})`);
        transform('front-wheel', `rotate(${wheelAngle % 360})`);
        transform('crank', `rotate(${phase * 180 / Math.PI % 360} 778 601)`);
        transform('rider', `translate(0 ${bob})`);
        parts['rider-shadow'].setAttribute('rx', 259 + Math.sin(phase * 2) * 2);
        leg(phase, false);
        leg(phase + Math.PI, true);
        transform('scarf-tail', `translate(790 320) rotate(${Math.sin(time * 5) * 5}) scale(1 ${1 + Math.sin(time * 3.6) * .09})`);
        const blink = time % 5.8;
        transform('eye', `translate(842 221) scale(1 ${blink > 5.55 ? Math.max(.08, Math.abs(blink - 5.675) / .125) : 1})`);
        transform('clouds', `translate(${-Math.sin(time * .025) * 48} 0)`);
        transform('distant-birds', `translate(${-Math.sin(time * .1) * 18} ${Math.sin(time * .9) * 3})`);
        transform('sailboat', `translate(${377 - Math.sin(time * .04) * 32} ${449 + Math.sin(time * 1.3) * 2}) rotate(${Math.sin(time) * 2})`);
        scroll('sea-waves', time * 9);
        scroll('sand', time * 94);
        scroll('road', time * 279);
        scroll('far-plants', time * 145);
        scroll('foreground', time * 310);
        parts['wind-lines'].setAttribute('opacity', .28 + (Math.sin(time * 3) + 1) * .15);
        parts['bell-rings'].setAttribute('opacity', now < bellUntil ? .6 + Math.sin(now / 60) * .3 : 0);
      }

      function frame(now) {
        if (lastTime !== null && !paused) time += Math.min((now - lastTime) / 1000, .05) * speed;
        lastTime = now;
        draw(now);
        requestAnimationFrame(frame);
      }

      $('play').addEventListener('click', () => {
        paused = !paused;
        $('play').setAttribute('aria-pressed', String(paused));
        $('play').setAttribute('aria-label', paused ? '继续播放动画' : '暂停动画');
        $('play-label').textContent = paused ? '继续兜风' : '歇一会儿';
        $('play-icon').setAttribute('d', paused ? 'M4 2 14 8 4 14Z' : 'M4 3h3v10H4zm5 0h3v10H9z');
        $('ride-status').textContent = paused ? '停一停，听听海风。' : '正在享受，无所事事的快乐。';
      });

      $('speed').addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        speed = speeds[speedIndex];
        $('speed-label').textContent = `${speed}×`;
        $('speed').setAttribute('aria-label', `切换骑行速度，当前 ${speed} 倍`);
        $('announcement').textContent = `骑行速度已切换为 ${speed} 倍`;
      });

      $('ring').addEventListener('click', () => {
        bellUntil = performance.now() + 1300;
        $('announcement').textContent = '叮铃！和海风打个招呼。';
        // Sound is synthesized locally and starts only after the bell button is pressed.
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) return;
        try {
          audioContext ||= new Audio();
          audioContext.resume().then(() => {
            const start = audioContext.currentTime;
            [0, .17].forEach((delay, strike) => {
              [1, 2.756, 5.4].forEach((ratio, harmonic) => {
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.frequency.value = (strike ? 1460 : 1680) * ratio;
                gain.gain.setValueAtTime(0, start + delay);
                gain.gain.linearRampToValueAtTime(.08 / (harmonic + 1), start + delay + .004);
                gain.gain.exponentialRampToValueAtTime(.0001, start + delay + 1.1);
                oscillator.connect(gain).connect(audioContext.destination);
                oscillator.start(start + delay);
                oscillator.stop(start + delay + 1.15);
                oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
              });
            });
          }).catch(() => {});
        } catch (_) { /* The visual bell also works in browsers without audio. */ }
      });

      document.addEventListener('visibilitychange', () => { lastTime = null; });
      requestAnimationFrame(frame);
    })();
  </script>
