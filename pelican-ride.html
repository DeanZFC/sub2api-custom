<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f2e9">
  <title>骑着风，去海边。 · Pelican Ride Club</title>
  <style>
    :root { --paper:#f6f2e9; --ink:#263f37; --muted:#7a8274; --line:#d8dccc; --orange:#ec7950; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; }
    button:focus-visible { outline:3px solid var(--orange); outline-offset:5px; }
    .page { width:min(1440px,100%); margin:auto; padding:26px 52px 22px; }
    .masthead { display:flex; align-items:center; justify-content:space-between; padding-bottom:21px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand svg { width:43px; height:43px; }
    .brand-name { font-size:12px; font-weight:800; letter-spacing:2.2px; }
    .brand-sub { margin-top:5px; font-size:9px; letter-spacing:3.4px; color:var(--muted); }
    .edition { display:flex; gap:24px; align-items:center; font-size:10px; letter-spacing:1.5px; }
    .edition span:first-child { padding:8px 11px; border:1px solid var(--line); border-radius:4px; }
    .intro { display:flex; justify-content:space-between; align-items:flex-end; padding:32px 0 28px; gap:24px; }
    .eyebrow { font-size:10px; letter-spacing:2.5px; color:var(--muted); margin:0 0 13px; }
    h1 { margin:0; font-size:clamp(30px,3.4vw,48px); font-weight:600; letter-spacing:1px; line-height:1.3; }
    h1 em { font-style:normal; color:var(--orange); }
    .intro-aside { font-size:12px; color:#788173; line-height:1.9; text-align:right; margin:0 0 3px; }
    .intro-aside i { font-family:Georgia,serif; font-size:15px; color:var(--ink); }
    .artboard { position:relative; overflow:hidden; background:#e9eee0; border-radius:10px; border:1px solid #263f3710; }
    #scene { display:block; width:100%; height:auto; }
    .scene-note { position:absolute; left:28px; top:24px; font-size:9px; letter-spacing:2.1px; display:flex; align-items:center; gap:8px; color:#536c57; pointer-events:none; }
    .scene-note::before { content:""; width:6px; height:6px; background:#648d6c; border-radius:50%; box-shadow:0 0 0 4px #648d6c16; }
    .scene-tag { position:absolute; right:26px; top:24px; color:#5f705a; font-size:9px; letter-spacing:1.8px; }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:23px 0; border-bottom:1px solid var(--line); }
    .caption { display:flex; gap:13px; align-items:center; }
    .caption svg { width:36px; height:36px; flex:none; }
    .caption strong { font-size:12px; font-weight:500; letter-spacing:1px; display:block; }
    .caption small { display:block; color:var(--muted); font-size:10px; letter-spacing:.8px; margin-top:6px; }
    .buttons { display:flex; gap:9px; align-items:center; }
    .button { display:flex; gap:8px; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); background:transparent; border:1px solid #cfd5c7; border-radius:50px; padding:11px 17px; min-height:42px; font-size:11px; letter-spacing:.5px; transition:background .2s,transform .2s; }
    .button:hover { background:#e9eadf; transform:translateY(-2px); }
    .button svg { width:14px; height:14px; }
    .button.primary { color:var(--paper); background:var(--ink); border-color:var(--ink); min-width:114px; }
    .button.primary:hover { background:#3e5d50; }
    #speed-value { font-weight:700; font-variant-numeric:tabular-nums; }
    footer { display:flex; justify-content:space-between; gap:12px; padding-top:20px; font-size:9px; letter-spacing:1.4px; color:#899081; }
    .signature { font-family:Georgia,serif; font-style:italic; font-size:12px; letter-spacing:.3px; }
    .outline { stroke:#34483d; stroke-linecap:round; stroke-linejoin:round; }
    @media (min-width:1600px) { .page { padding-top:38px; } .intro { padding-top:40px; padding-bottom:33px; } }
    @media (max-width:760px) {
      .page { padding:20px 18px; } .brand-name { font-size:10px; letter-spacing:1.5px; } .brand-sub { font-size:8px; letter-spacing:2.7px; }
      .edition { font-size:9px; } .edition span:last-child { display:none; }
      .intro { display:block; padding:26px 0 22px; } .intro-aside { margin-top:14px; text-align:left; font-size:11px; } .intro-aside br { display:none; } .intro-aside i { margin-right:8px; font-size:13px; }
      #scene { width:160%; max-width:none; margin-left:-30%; } .scene-note { top:17px; left:17px; font-size:8px; letter-spacing:1px; } .scene-tag { top:17px; right:17px; font-size:8px; }
      .controls { flex-wrap:wrap; gap:20px; } .buttons { width:100%; } .button { flex:1; padding:10px 12px; }
      footer { font-size:8px; letter-spacing:.5px; } .signature { font-size:10px; }
    }
  </style>
</head>

      <div><p class="eyebrow">A SMALL ESCAPE, ON TWO WHEELS</p><h1>骑着风，<em>去海边。</em></h1></div>
      <p class="intro-aside"><i>Nowhere to rush. Somewhere to go.</i><br>带上一点好心情，剩下的交给海风。</p>

          <text x="0" y="19" text-anchor="middle" stroke="none" fill="#64785d" font-family="monospace" font-size="8" letter-spacing="2">GO SLOW</text>
        </g>
        <text x="33" y="626" fill="#8c9678" font-family="monospace" font-size="9" letter-spacing="2">EST. TODAY / DESTINATION: HAPPINESS</text>
      </svg>
    </section>

    <section class="controls" aria-label="动画控制">
      <div class="caption">
        <svg viewBox="0 0 38 38" fill="none" aria-hidden="true"><circle cx="19" cy="19" r="17.5" stroke="#c7cebc"/><path d="M9 19h17m-5-5 5 5-5 5" stroke="#6f856a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div><strong>今天的目的地：好心情</strong><small>双脚慢慢踩，世界慢慢看。</small></div>
      </div>
      <div class="buttons">
        <button class="button" id="speed" type="button" aria-label="切换骑行速度，当前 1 倍"><span id="speed-value">1×</span><span>骑行速度</span></button>
        <button class="button" id="restart" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 7a7 7 0 1 1 0 7M4 2v5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>重新出发</button>
        <button class="button primary" id="pause" type="button" aria-label="暂停动画" aria-pressed="false"><svg id="pause-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><span id="pause-label">歇一会儿</span></button>
      </div>
    </section>
    <footer><span>一段没有截止时间的旅程。</span><span class="signature">Made of sunshine & a little daydream.</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const nodes = Object.fromEntries(['rear-wheel','front-wheel','chainring','crank','near-leg','near-leg-highlight','far-leg','near-foot','far-foot','near-pedal','far-pedal','scarf-tail','scarf-tail-back','clouds','gulls','waves','road','foreground','sailboat','wind-streaks'].map(id => [id, byId(id)]));
      const tau = Math.PI * 2;
      const speeds = [1, 1.5, 2, .5];
      let speedIndex = 0, paused = false, elapsed = 0, last = null, frameId = null;
      const n = value => Number(value.toFixed(2));

      // Two connected leg segments follow the actual crank endpoints.
      function legPosition(angle, hipX, hipY) {
        const x = 602 + 31 * Math.cos(angle), y = 475 + 31 * Math.sin(angle);
        const dx = x - hipX, dy = y - hipY, distance = Math.hypot(dx, dy);
        const thigh = 90, shin = 96;
        const projection = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - projection * projection));
        const kneeX = hipX + dx * projection / distance + dy * bend / distance;
        const kneeY = hipY + dy * projection / distance - dx * bend / distance;
        return { x:n(x), y:n(y), path:`M${hipX} ${hipY} Q${n(hipX + 5)} ${n(hipY + 15)} ${n(kneeX)} ${n(kneeY)} L${n(x)} ${n(y)}` };
      }

      function draw(t) {
        const phase = t * tau / 1.65;
        const near = legPosition(phase, 562, 335), far = legPosition(phase + Math.PI, 564, 331);
        nodes['near-leg'].setAttribute('d', near.path);
        nodes['near-leg-highlight'].setAttribute('d', near.path);
        nodes['far-leg'].setAttribute('d', far.path);
        nodes['near-foot'].setAttribute('d', `M${near.x-7} ${near.y-4}q12-7 20 0l13 8q-17 5-35 1Z`);
        nodes['far-foot'].setAttribute('d', `M${far.x-6} ${far.y}h27`);
        nodes['near-pedal'].setAttribute('d', `M${near.x-12} ${near.y+8}h40`);
        nodes['far-pedal'].setAttribute('d', `M${far.x-11} ${far.y+7}h38`);
        nodes.crank.setAttribute('d', `M${far.x} ${far.y}L${near.x} ${near.y}`);
        nodes.chainring.setAttribute('transform', `rotate(${n(phase*180/Math.PI)} 602 475)`);
        // Wheel travel and road travel use the same physical distance.
        const travel = t * 136;
        const rotation = n(travel / 91 * 180 / Math.PI);
        nodes['rear-wheel'].setAttribute('transform', `rotate(${rotation})`);
        nodes['front-wheel'].setAttribute('transform', `rotate(${rotation})`);
        nodes.foreground.setAttribute('transform', `translate(${-n(travel % 1200)} 0)`);
        byId('road-pattern').setAttribute('patternTransform', `translate(${-n(travel % 220)} 0)`);
        byId('wave-pattern').setAttribute('patternTransform', `translate(${-n(t * 14 % 240)} 0)`);
        nodes.clouds.setAttribute('transform', `translate(${-n(t * 7 % 1400)} 0)`);
        nodes.gulls.setAttribute('transform', `translate(${n(Math.sin(t*.4)*11)} ${n(Math.sin(t*1.5)*3)})`);
        nodes.sailboat.setAttribute('transform', `translate(${n(969+Math.sin(t*.16)*35)} ${n(302+Math.sin(t*1.5)*2)})`);
        const flutter = Math.sin(phase*1.5)*5, flutter2 = Math.sin(phase*1.5+1.2)*4;
        nodes['scarf-tail-back'].setAttribute('d', `M604 215C568 ${197+flutter} 548 ${224+flutter2} 512 ${204+flutter}L517 ${222+flutter}C555 ${236+flutter2} 576 ${208+flutter} 604 229Z`);
        nodes['scarf-tail'].setAttribute('d', `M606 219C566 ${224+flutter2} 554 ${243+flutter} 514 ${227+flutter2}L522 ${247+flutter2}C560 ${261+flutter} 582 ${230+flutter2} 611 232Z`);
        nodes['wind-streaks'].setAttribute('transform', `translate(${n(-10 * (t % 2))} 0)`);
        nodes['wind-streaks'].setAttribute('opacity', n(.35 + .35 * (1 + Math.sin(t*3)) / 2));
      }

      function frame(now) {
        frameId = null;
        if (paused || document.hidden) { last = null; return; }
        if (last !== null) elapsed += Math.min((now-last)/1000, .1) * speeds[speedIndex];
        last = now;
        draw(elapsed);
        frameId = requestAnimationFrame(frame);
      }
      function start() {
        if (frameId === null && !paused && !document.hidden) { last = null; frameId = requestAnimationFrame(frame); }
      }
      function updatePause() {
        byId('pause').setAttribute('aria-pressed', String(paused));
        byId('pause').setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        byId('pause-label').textContent = paused ? '继续兜风' : '歇一会儿';
        byId('pause-icon').innerHTML = paused ? '<path d="m5 2 9 6-9 6z"/>' : '<path d="M4 3h3v10H4zm5 0h3v10H9z"/>';
        byId('scene-status').textContent = paused ? 'A LITTLE BREAK · 看一会儿海' : 'ON THE ROAD · 正在兜风';
      }
      byId('pause').addEventListener('click', () => {
        paused = !paused;
        if (paused && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        updatePause(); start();
      });
      byId('speed').addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        byId('speed-value').textContent = `${speeds[speedIndex]}×`;
        byId('speed').setAttribute('aria-label', `切换骑行速度，当前 ${speeds[speedIndex]} 倍`);
      });
      byId('restart').addEventListener('click', () => { elapsed = 0; last = null; paused = false; draw(0); updatePause(); start(); });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; last = null; }
        else start();
      });
      draw(0); start();
    })();
  </script>
</body>
</html>
