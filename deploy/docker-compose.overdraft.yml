# Legacy compatibility overlay for deployments created before the generic
# sub2api-custom branding. New deployments should use docker-compose.custom.yml.
# Use together with docker-compose.local.yml from this directory:
#   docker compose -p sub2api-overdraft \
#     -f docker-compose.local.yml \
#     -f docker-compose.overdraft.yml \
#     -f docker-compose.coexist.yml up -d --build

services:
  sub2api:
    image: sub2api-custom:local
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Keep this empty so source builds always read the tracked FORK_VERSION.
        # This avoids unrelated host BUILD_VERSION values overriding the Fork version.
        VERSION: ""
        COMMIT: ${BUILD_COMMIT:-local}
        BUILD_TYPE: source
    environment:
      - GATEWAY_CODEX_QUOTA_OVERDRAFT_ENABLED=${GATEWAY_CODEX_QUOTA_OVERDRAFT_ENABLED:-true}
      - GATEWAY_OPENAI_ACCOUNT_UNIQUE_FINGERPRINT_ENABLED=${GATEWAY_OPENAI_ACCOUNT_UNIQUE_FINGERPRINT_ENABLED:-true}
