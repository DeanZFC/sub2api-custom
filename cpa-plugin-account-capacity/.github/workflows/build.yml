name: Build CPA account capacity plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Build Linux amd64 plugin
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -trimpath -o account-capacity.so .
          rm -f account-capacity.h

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: account-capacity-linux-amd64
          path: account-capacity.so
