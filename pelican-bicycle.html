<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>把日子，骑慢一点。｜鹈鹕海岸骑行</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3e9; --ink: #234d4a; --muted: #71837a; --line: #d9dfd2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    .page { max-width: 1328px; margin: auto; padding: 32px 48px 26px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-name { font-size: 12px; font-weight: 800; letter-spacing: 2.8px; }
    .brand-sub { display: block; margin-top: 4px; font-size: 10px; font-weight: 400; letter-spacing: 3px; color: var(--muted); }
    .weather { display: flex; align-items: center; gap: 9px; font-size: 11px; letter-spacing: 1px; }
    .weather svg { width: 22px; height: 22px; }
    .intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; padding: 33px 0 29px; }
    .eyebrow { margin: 0 0 12px; font-size: 10px; letter-spacing: 2.4px; color: var(--muted); }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(28px, 3.5vw, 46px); font-weight: 600; letter-spacing: 2px; line-height: 1.3; }
    .intro-copy { margin: 0 2px 3px 0; font-size: 12px; line-height: 2; color: var(--muted); letter-spacing: 1px; }
    .scene-wrap { position: relative; overflow: hidden; border-radius: 16px; background: #dcece1; isolation: isolate; }
    #coast { width: 100%; height: auto; display: block; }
    .scene-label { position: absolute; top: 27px; left: 29px; display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: 1.8px; color: #42685f; }
    .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #5c8b72; box-shadow: 0 0 0 4px #5c8b7212; }
    .postmark { position: absolute; right: 29px; top: 23px; width: 72px; height: 72px; transform: rotate(12deg); opacity: .5; }
    .scene-bottom { position: absolute; bottom: 24px; left: 29px; right: 29px; display: flex; justify-content: space-between; align-items: center; color: #617965; font-size: 10px; letter-spacing: 2px; }
    .scene-bottom .coordinates { font-variant-numeric: tabular-nums; font-size: 9px; letter-spacing: 1.5px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 23px 0; border-bottom: 1px solid var(--line); }
    .caption { display: flex; align-items: center; gap: 14px; }
    .caption-icon { width: 32px; height: 32px; padding: 6px; border: 1px solid #d7dfce; border-radius: 50%; }
    .caption strong { display: block; font-size: 12px; font-weight: 500; letter-spacing: 1.3px; }
    .caption span { display: block; margin-top: 5px; font-size: 9px; color: var(--muted); letter-spacing: 1.3px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .control { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 10px 16px; border-radius: 50px; border: 1px solid #d4ddd0; background: transparent; color: var(--ink); cursor: pointer; font-size: 11px; letter-spacing: .7px; transition: background .2s, transform .2s; }
    .control:hover { background: #e9eddf; transform: translateY(-1px); }
    .control:focus-visible { outline: 2px solid #d87954; outline-offset: 4px; }
    .control.primary { color: #f7f6ec; background: #2c5550; border-color: #2c5550; min-width: 122px; }
    .control.primary:hover { background: #396b62; }
    .control svg { width: 13px; height: 13px; }
    .speed-value { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }
    footer { display: flex; justify-content: space-between; padding-top: 20px; gap: 14px; font-size: 9px; color: #89958a; letter-spacing: 1.7px; }
    footer .signature { font-family: Georgia, serif; font-style: italic; font-size: 12px; letter-spacing: .3px; }
    .ink { stroke: #36594e; stroke-linecap: round; stroke-linejoin: round; }
    @media (min-width: 1500px) { .page { padding-top: 44px; } .intro { padding: 42px 0 35px; } }
    @media (max-width: 700px) {
      .page { padding: 20px 18px; } .masthead { padding-bottom: 18px; }
      .brand-name { font-size: 10px; letter-spacing: 2px; } .brand-sub { font-size: 9px; }
      .weather { font-size: 10px; } .weather .wind { display: none; }
      .intro { padding: 27px 0 22px; display: block; } .intro-copy { margin-top: 13px; font-size: 11px; } .intro-copy br { display: none; }
      .scene-wrap { border-radius: 12px; } #coast { width: 150%; max-width: none; margin-left: -25%; }
      .scene-label { top: 17px; left: 17px; font-size: 8px; } .postmark { width: 48px; height: 48px; right: 16px; top: 15px; }
      .scene-bottom { left: 17px; right: 17px; bottom: 15px; font-size: 8px; } .coordinates { display: none; }
      .toolbar { flex-wrap: wrap; gap: 20px; padding: 21px 0; } .controls { width: 100%; } .control { flex: 1; }
      footer { font-size: 8px; letter-spacing: 1px; } footer .signature { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="20.5" fill="none" stroke="#9aaa94"/>
          <path d="M11 28c3-5 8-5 11-2 4-1 5-5 4-9-1-4 2-7 5-6 3 1 3 4 1 6l7 2-9 1c1 9-5 14-12 12z" fill="#345b50"/>
          <path d="M13 27q5 0 9 4" fill="none" stroke="#f6f3e9" stroke-linecap="round"/>

        <div class="brand-name">SLOW DAYS<span class="brand-sub">鹈鹕骑行俱乐部</span></div>
      </div>
      <div class="weather">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8c9e74" stroke-width="1.3" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2 2m11.6 11.6 2 2M4.2 19.8l2-2M17.8 6.2l2-2"/></svg>
        <span>24° 晴<span class="wind"> &nbsp; / &nbsp; 宜兜风</span></span>

    </header>

    <section class="intro" aria-labelledby="page-title">
      <div><p class="eyebrow">THE LITTLE JOURNEYS &nbsp; / &nbsp; VOL. 008</p><h1 id="page-title">把日子，骑慢一点。</h1></div>
      <p class="intro-copy">一阵海风，一辆单车，一只不赶时间的鹈鹕。<br>今天的目的地，是沿途的好心情。</p>
    </section>

        <circle cx="40" cy="40" r="30" fill="none" stroke="#658f7c"/>
        <path d="M20 43q10-7 20 0t20 0M20 48q10-7 20 0t20 0M33 34a8 8 0 0 1 16 0" fill="none" stroke="#658f7c"/>
        <text x="40" y="24" text-anchor="middle" font-family="sans-serif" font-size="6" letter-spacing="2" fill="#527d6c">SLOW DAYS</text>
        <text x="40" y="61" text-anchor="middle" font-family="sans-serif" font-size="5" letter-spacing="1" fill="#527d6c">COASTAL CLUB</text>
      </svg>

          <!-- The legs and horizontal webbed feet follow the actual crank. -->
          <path id="near-leg" d="M554 365 632 420 627 516" fill="none" stroke="#c28f48" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="near-leg-highlight" d="M554 365 632 420 627 516" fill="none" stroke="#e8b45e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="near-foot" d="M615 510q8-4 14 0l18 10h-31Z" fill="#efbb62" stroke="#b98b45" stroke-width="1.7" stroke-linejoin="round"/>
          <path id="near-toes" d="m628 512 6 7m-13-6 5 6" fill="none" stroke="#d39b4e" stroke-width="1.2"/>
          <path id="far-pedal" d="M552 522h22" stroke="#3b5a4e" stroke-width="5" stroke-linecap="round"/>
          <path id="near-pedal" d="M616 522h22" stroke="#3b5a4e" stroke-width="5" stroke-linecap="round"/>
          <!-- The forward wing rests on the handlebar. -->
          <path d="M538 294Q572 285 596 309Q612 327 637 332L710 348Q725 350 725 359Q718 369 704 363L623 354Q576 364 547 343Q530 329 538 294Z" fill="#faf7e8" stroke="#a1ad91" stroke-width="2" stroke-linejoin="round"/>
          <path d="M549 310Q569 337 604 340L677 352M552 324Q569 344 595 348M693 351l17 6m-21-1 16 5" fill="none" stroke="#d5d9c0" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Foreground plants pass faster than the distant shore. -->
        <g id="foreground">
          <g id="plant-strip">
            <use href="#grass" x="96" y="641"/><use href="#flowers" x="166" y="647"/><use href="#grass" x="293" y="653" transform="translate(58 131) scale(.8)"/>
            <use href="#grass" x="947" y="644"/><use href="#flowers" x="1035" y="654"/><use href="#grass" x="1142" y="659"/>
            <path d="M354 641h14m421 5h20m339-11h9" stroke="#a6b38a" stroke-width="3" stroke-linecap="round"/>
          </g>
          <use href="#plant-strip" x="1200"/>
        </g>
      </svg>

      <div class="scene-bottom"><span>↗ &nbsp; 沿着海风，继续向前</span><span class="coordinates">PELICAN COAST &nbsp; · &nbsp; KM <span id="distance">0.00</span></span></div>
    </div>

    <div class="toolbar">
      <div class="caption">
        <svg class="caption-icon" viewBox="0 0 24 24" fill="none" stroke="#738c6f" stroke-width="1.4" aria-hidden="true"><path d="M3 9h13q5 0 5-4c0-4-6-4-6 0M3 13h13q5 0 5 4c0 4-6 4-6 0M3 17h6" stroke-linecap="round"/></svg>
        <div><strong id="caption-text">不着急，好风景就在路上。</strong><span>A LITTLE LESS HURRY, A LITTLE MORE JOY.</span></div>
      </div>
      <div class="controls" aria-label="动画控制">
        <button class="control" id="speed-button" type="button" aria-label="切换骑行速度，当前 1 倍"><span class="speed-value" id="speed-value">1×</span><span id="speed-label">轻快骑行</span></button>
        <button class="control primary" id="play-button" type="button" aria-label="暂停动画" aria-pressed="false"><svg id="play-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><span id="play-label">停一会儿</span></button>
      </div>
    </div>
    <footer><span>一只鹈鹕的日常 &nbsp; / &nbsp; 纯 SVG 动画</span><span class="signature">Enjoy the little things.</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const nodes = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'crank', 'far-leg', 'far-foot', 'far-pedal',
        'near-leg', 'near-leg-highlight', 'near-foot', 'near-toes', 'near-pedal',
        'bicycle-rider', 'bike-shadow', 'clouds', 'water', 'dune-scroll', 'road-scroll',
        'foreground', 'sailboat', 'gulls', 'eye', 'scarf-tail', 'scarf-stripe', 'distance'
      ].map((id) => [id, byId(id)]));
      let elapsed = 0;
      let lastTime = null;
      let paused = false;
      let speedIndex = 1;
      let frameId = null;
      const speeds = [0.6, 1, 1.5];
      const speedNames = ['悠闲兜风', '轻快骑行', '追上海风'];
      const round = (value) => Math.round(value * 100) / 100;
      const move = (id, x, y = 0) => nodes[id].setAttribute('transform', `translate(${round(x)} ${round(y)})`);

      // A two-link leg keeps each ankle attached to the circular pedal path.
      function drawLeg(phase, near) {
        const hipX = near ? 554 : 538;
        const hipY = near ? 365 : 361;
        const pedalX = 595 + Math.cos(phase) * 32;
        const pedalY = 516 + Math.sin(phase) * 32;
        const ankleX = pedalX - 3;
        const ankleY = pedalY - 8;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const length = Math.hypot(dx, dy);
        const bend = Math.sqrt(Math.max(0, 107 * 107 - length * length / 4));
        const kneeX = (hipX + ankleX) / 2 + dy / length * bend;
        const kneeY = (hipY + ankleY) / 2 - dx / length * bend;
        const path = `M${hipX} ${hipY}Q${round(kneeX - 8)} ${round(kneeY - 5)} ${round(kneeX)} ${round(kneeY)}L${round(ankleX)} ${round(ankleY)}`;
        const prefix = near ? 'near' : 'far';
        nodes[`${prefix}-leg`].setAttribute('d', path);
        if (near) nodes['near-leg-highlight'].setAttribute('d', path);
        nodes[`${prefix}-foot`].setAttribute('d', `M${round(ankleX - 7)} ${round(ankleY - 2)}Q${round(ankleX + 2)} ${round(ankleY - 7)} ${round(ankleX + 9)} ${round(ankleY)}L${round(ankleX + 24)} ${round(pedalY + 2)}Q${round(ankleX + 10)} ${round(pedalY + 6)} ${round(ankleX - 8)} ${round(pedalY + 2)}Z`);
        nodes[`${prefix}-pedal`].setAttribute('d', `M${round(pedalX - 11)} ${round(pedalY + 5)}h22`);
        if (near) nodes['near-toes'].setAttribute('d', `M${round(ankleX + 5)} ${round(ankleY + 1)}l8 8m-15-6 5 7`);
      }

      function render(time) {
        const phase = time * Math.PI * 2 / 1.65;
        const wheelDegrees = time * 165 / 94 * 180 / Math.PI;
        nodes['rear-wheel'].setAttribute('transform', `rotate(${round(wheelDegrees % 360)})`);
        nodes['front-wheel'].setAttribute('transform', `rotate(${round(wheelDegrees % 360)})`);
        nodes.crank.setAttribute('transform', `rotate(${round(phase * 180 / Math.PI % 360)})`);
        drawLeg(phase + Math.PI, false);
        drawLeg(phase, true);
        move('bicycle-rider', 0, Math.sin(phase * 2) * 1.15);
        nodes['bike-shadow'].setAttribute('rx', round(246 + Math.sin(phase * 2) * 3));
        move('clouds', -(time * 3 % 1500));
        move('water', -(time * 12 % 1200));
        move('dune-scroll', -(time * 24 % 1200));
        move('road-scroll', -(time * 165 % 1200));
        move('foreground', -(time * 165 % 1200));
        move('sailboat', 1020 - time * 2 % 1400, 337 + Math.sin(time * 1.4) * 2);
        move('gulls', Math.sin(time * .35) * 12, Math.sin(time * 1.7) * 3);
        const blink = time % 5.7;
        const eyeScale = blink > 5.4 ? Math.max(.07, Math.abs(blink - 5.55) / .15) : 1;
        nodes.eye.setAttribute('transform', `translate(675 179) scale(1 ${round(eyeScale)})`);
        const flutter = Math.sin(time * 7) * 6;
        nodes['scarf-tail'].setAttribute('d', `M613 251C581 ${247 + flutter} 560 ${227 - flutter} 535 ${237 + flutter}L516 ${231 + flutter} 520 ${249 + flutter}C555 ${247 + flutter} 571 ${271 - flutter} 610 264Z`);
        nodes['scarf-stripe'].setAttribute('d', `M603 256Q558 ${237 - flutter} 525 ${242 + flutter}`);
        nodes.distance.textContent = (time * .0034).toFixed(2);
      }

      function frame(now) {
        frameId = null;
        if (paused || document.hidden) { lastTime = null; return; }
        if (lastTime !== null) elapsed += Math.min((now - lastTime) / 1000, .08) * speeds[speedIndex];
        lastTime = now;
        render(elapsed);
        frameId = requestAnimationFrame(frame);
      }

      function schedule() {
        if (frameId === null && !paused && !document.hidden) frameId = requestAnimationFrame(frame);
      }

      byId('play-button').addEventListener('click', () => {
        paused = !paused;
        lastTime = null;
        byId('play-button').setAttribute('aria-pressed', String(paused));
        byId('play-button').setAttribute('aria-label', paused ? '继续播放动画' : '暂停动画');
        byId('play-label').textContent = paused ? '继续兜风' : '停一会儿';
        byId('play-icon').innerHTML = paused ? '<path d="m5 2 9 6-9 6z"/>' : '<path d="M4 3h3v10H4zm5 0h3v10H9z"/>';
        byId('scene-status').textContent = paused ? '在海边，歇一小会儿' : '海岸线上的好天气';
        byId('caption-text').textContent = paused ? '停下来，也是一种好时光。' : '不着急，好风景就在路上。';
        if (paused && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });

      byId('speed-button').addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        byId('speed-value').textContent = `${speeds[speedIndex]}×`;
        byId('speed-label').textContent = speedNames[speedIndex];
        byId('speed-button').setAttribute('aria-label', `切换骑行速度，当前 ${speeds[speedIndex]} 倍`);
      });

      document.addEventListener('visibilitychange', () => {
        lastTime = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      render(0);
      schedule();
    })();
  </script>
</body>
</html>
