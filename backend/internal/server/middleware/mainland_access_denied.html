<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>当前地区暂不支持访问</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f7fa;
        --surface: #ffffff;
        --text: #232735;
        --muted: #737b8c;
        --line: #eceef3;
        --accent: #7776a8;
        --accent-soft: #f2f1f9;
        --glow: rgba(127, 122, 183, 0.07);
        --shadow: 0 16px 64px rgba(39, 44, 66, 0.045);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: radial-gradient(ellipse at 50% 24%, var(--glow), transparent 62%), var(--page);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .notice {
        width: 100%;
        max-width: 548px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .content {
        padding: 48px 42px 40px;
      }

      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 34px;
      }

      .symbol {
        display: grid;
        width: 72px;
        height: 72px;
        flex-shrink: 0;
        place-items: center;
        border-radius: 22px;
        background: var(--accent-soft);
        color: var(--accent);
      }

      .symbol svg {
        display: block;
        width: 45px;
        height: 45px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      .status::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -0.035em;
        overflow-wrap: anywhere;
      }

      .description {
        margin: 16px 0 0;
        max-width: 390px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.95;
        text-wrap: pretty;
      }

      .translation {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.75;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 18px 42px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .footer svg {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }

      @media (max-width: 480px) {
        .notice {
          border-radius: 20px;
        }

        .content {
          padding: 32px 26px;
        }

        .heading {
          margin-bottom: 28px;
        }

        h1 {
          font-size: 24px;
        }

        .description {
          font-size: 13px;
        }

        .footer {
          padding: 17px 26px;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #121419;
          --surface: #1b1e25;
          --text: #e7e9f0;
          --muted: #969dad;
          --line: #2a2e39;
          --accent: #aaa6d6;
          --accent-soft: #29283b;
          --glow: rgba(127, 122, 183, 0.06);
          --shadow: 0 16px 64px rgba(0, 0, 0, 0.12);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="notice" aria-labelledby="notice-title">
      <div class="content">
        <div class="heading">
          <div class="symbol" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="21" cy="21" r="15" />
              <ellipse cx="21" cy="21" rx="6.5" ry="15" />
              <path d="M6 21h30M9.5 11.5c7 4 16 4 23 0M9.5 30.5c4-2.3 8.5-3.3 13-3" />
              <circle cx="34" cy="34" r="12" fill="var(--accent-soft)" stroke="none" />
              <rect x="27.5" y="32" width="13" height="10" rx="2.5" />
              <path d="M30 32v-3a4 4 0 0 1 8 0v3M34 36v2" />
            </svg>
          </div>
          <span class="status">403 · 访问受限</span>
        </div>
        <h1 id="notice-title">当前地区暂不支持访问</h1>
        <p class="description">抱歉，本站暂不向您所在的地区提供网页访问服务。感谢您的理解。</p>
        <p class="translation" lang="en">Access unavailable in your region.</p>
      </div>
      <p class="footer">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M8 1.5 13 3.5v4c0 3-3.3 5.5-5 7-1.7-1.5-5-4-5-7v-4Z" />
          <path d="m5.7 7.7 1.5 1.5 3.1-3.1" />
        </svg>
        <span>根据本站服务地区政策，此页面暂不可用</span>
      </p>
    </main>
  </body>
</html>
